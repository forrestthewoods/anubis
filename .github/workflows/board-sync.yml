name: Board sync

# Copies issue labels onto the Anubis Issue Tracker board (user project #8).
# Labels are the source of truth; see .claude/skills/issue-workflow/SKILL.md.
# Each run rebuilds every card from labels, so missed or out-of-order runs heal
# on the next one. The schedule is the safety net.

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: board-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # label colors

jobs:
  sync:
    runs-on: ubuntu-latest
    # Forks and repos without the token skip quietly instead of failing.
    if: github.repository == 'forrestthewoods/anubis'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Check for PROJECT_PAT
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
        run: |
          if [ -z "$PROJECT_PAT" ]; then
            echo "::error::Repo secret PROJECT_PAT is not set (classic PAT with the 'project' scope)."
            exit 1
          fi
      - uses: actions/github-script@v7
        env:
          PROJECT_OWNER: forrestthewoods
          PROJECT_NUMBER: "8"
          REPO_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const sync = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/board-sync.js`);
            // A second client on GITHUB_TOKEN for labels; same Octokit class as `github`.
            const labelsApi = new github.constructor({ auth: process.env.REPO_TOKEN });
            await sync.run({ github, labelsApi, context, core });
