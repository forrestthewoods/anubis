name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux host: native Linux builds plus Windows cross-compiles.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build anubis
        run: cargo build --release --workspace

      - name: Install toolchains (LLVM, Zig, MSVC CRT, Windows SDK)
        run: ./target/release/anubis install-toolchains --no-tui

      - name: Test
        run: cargo test --release --workspace

      - name: Build samples (linux + windows, dev + release)
        run: |
          ./target/release/anubis build --no-tui \
            -m //mode:linux_dev //mode:linux_release //mode:win_dev //mode:win_release \
            -t //samples/basic/...

      - name: Build modeless targets (archive_zip, archive_7z, no -m)
        run: |
          ./target/release/anubis build --no-tui -t //samples/basic/nasm_c:src //samples/basic/nasm_c:src_7z
          python3 -m zipfile -l .anubis-out/modeless/samples/basic/nasm_c/src/zip/src.zip | grep nasm_c/main.c
          python3 -c "import sys; assert open(sys.argv[1], 'rb').read(6) == b'7z\xbc\xaf\x27\x1c'" .anubis-out/modeless/samples/basic/nasm_c/src_7z/7z/src_7z.7z

      - name: Rebuild with warm cache (expect no misses)
        run: |
          rm -rf .anubis-out
          ./target/release/anubis build --no-tui \
            -m //mode:linux_dev //mode:linux_release //mode:win_dev //mode:win_release \
            -t //samples/basic/... 2>&1 | tee build.log
          grep -q 'build cache: [0-9]* hits, 0 misses' build.log

      - name: New shadowing headers are cache misses
        run: tools/cache_shadow_test.sh

      - name: Run Linux samples
        run: |
          # simple_cpp is a memory benchmark (minutes of subprocesses); build only.
          for exe in .anubis-out/linux_*/samples/basic/*/main/bin/main; do
            case "$exe" in *simple_cpp*) continue ;; esac
            echo "=== $exe"
            "$exe"
          done

      - name: Collect Windows executables
        run: |
          # Whole bin dir per sample: an exe's DLLs sit next to it.
          mkdir -p dist
          for exe in .anubis-out/win_*/samples/basic/*/main/bin/main.exe; do
            mode=$(echo "$exe" | cut -d/ -f2 | sed 's/_[0-9a-f]*$//')
            sample=$(echo "$exe" | cut -d/ -f5)
            mkdir -p "dist/${mode}-${sample}"
            cp "$(dirname "$exe")"/*.exe "$(dirname "$exe")"/*.dll "dist/${mode}-${sample}/" 2>/dev/null || true
          done
          ls -lR dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exes-from-linux
          path: dist/
          if-no-files-found: error

      - name: Clean
        run: |
          ./target/release/anubis clean
          test ! -e .anubis-out && test ! -e .anubis-cache && test ! -e .anubis-temp

  # Run the executables the Linux job cross-compiled.
  windows-run-cross:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-exes-from-linux
          path: dist
      - name: Run cross-compiled samples
        # A CRT assertion dialog blocks forever on a runner; fail fast instead.
        timeout-minutes: 5
        shell: bash
        run: |
          for exe in dist/*/main.exe; do
            case "$exe" in *simple_cpp*) continue ;; esac
            echo "=== $exe"
            "$exe"
          done

  # Windows host: native Windows builds plus Linux cross-compiles.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build anubis
        shell: bash
        run: cargo build --release --workspace

      - name: Install toolchains (LLVM, Zig, NASM, MSVC CRT, Windows SDK)
        shell: bash
        run: ./target/release/anubis.exe install-toolchains --no-tui

      - name: Test
        shell: bash
        run: cargo test --release --workspace

      - name: Build and run Windows samples
        timeout-minutes: 20
        shell: bash
        env:
          # Git Bash turns //mode:x into /mode:x without this. Scoped to this
          # step: set globally it breaks git's file:// clones in Natron tests.
          MSYS_NO_PATHCONV: "1"
        run: |
          ./target/release/anubis.exe build --no-tui \
            -m //mode:win_dev //mode:win_release //mode:linux_dev \
            -t //samples/basic/...
          # Warm cache on Windows: delete outputs (read-only hard links to
          # cache blobs), rebuild, expect zero misses.
          rm -rf .anubis-out
          ./target/release/anubis.exe build --no-tui \
            -m //mode:win_dev //mode:win_release //mode:linux_dev \
            -t //samples/basic/... 2>&1 | tee build.log
          grep -q 'build cache: [0-9]* hits, 0 misses' build.log
          ./target/release/anubis.exe build --no-tui -t //samples/basic/nasm_c:src //samples/basic/nasm_c:src_7z
          python -m zipfile -l .anubis-out/modeless/samples/basic/nasm_c/src/zip/src.zip | grep nasm_c/main.c
          python -c "import sys; assert open(sys.argv[1], 'rb').read(6) == b'7z\xbc\xaf\x27\x1c'" .anubis-out/modeless/samples/basic/nasm_c/src_7z/7z/src_7z.7z
          for exe in .anubis-out/win_*/samples/basic/*/main/bin/main.exe; do
            case "$exe" in *simple_cpp*) continue ;; esac
            echo "=== $exe"
            "$exe"
          done
          # Outputs are now read-only hard links to cache blobs. Change code
          # so compile and link re-run over them, then run the result.
          echo 'int anubis_ci_extra() { return 1; }' >> samples/basic/trivial_cpp/main.cpp
          ./target/release/anubis.exe build --no-tui \
            -m //mode:win_dev -t //samples/basic/trivial_cpp:main 2>&1 | tee rebuild.log
          grep -q 'build cache: [0-9]* hits, 2 misses' rebuild.log
          .anubis-out/win_dev_*/samples/basic/trivial_cpp/main/bin/main.exe
          git checkout samples/basic/trivial_cpp/main.cpp
          # New shadowing headers are cache misses (native Windows lookup).
          tools/cache_shadow_test.sh
          # `clean` deletes everything, including read-only cache blobs.
          ./target/release/anubis.exe clean
          test ! -e .anubis-out && test ! -e .anubis-cache && test ! -e .anubis-temp

  # Experimental: export the samples to CMake and build them with the
  # runner's own compilers (no Anubis toolchains installed).
  cmake-export:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc, os: ubuntu-latest, configure: "-G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++" }
          - { name: linux-clang, os: ubuntu-latest, configure: "-G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++" }
          - { name: windows-clang-cl, os: windows-latest, configure: "-G \"Visual Studio 17 2022\" -A x64 -T ClangCL" }
          - { name: windows-clang, os: windows-latest, configure: "-G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++" }
          - { name: macos-appleclang, os: macos-latest, configure: "-G Ninja" }
    name: cmake-export (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build anubis and anubis-cmake
        shell: bash
        run: cargo build --release -p anubis -p anubis_cmake

      - name: Export, configure, build, run
        timeout-minutes: 20
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          targets=$(./target/release/anubis targets //samples/basic/... | grep -v nasm_c)
          ./target/release/anubis-cmake --namespace samples \
            -m //mode:linux_dev //mode:linux_release //mode:win_dev //mode:win_release \
            -t $targets -o .anubis-temp/cmake/CMakeLists.txt
          eval cmake -S .anubis-temp/cmake -B build-cmake -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}
          cmake --build build-cmake --config Release
          ran=0
          for exe in $(find build-cmake -type f \( -name 'samples_*_main' -o -name 'samples_*_main.exe' \)); do
            case "$exe" in *simple_cpp*) continue ;; esac
            echo "=== $exe"
            "$exe"
            ran=$((ran+1))
          done
          test "$ran" -ge 5

      # cl.exe takes different flags; the export must refuse it, not guess.
      - name: cl.exe is refused
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if cmake -S .anubis-temp/cmake -B build-msvc -G "Visual Studio 17 2022" -A x64 > msvc.log 2>&1; then
            echo "expected configure to fail with cl.exe"; exit 1
          fi
          grep -q "cl.exe isn't supported" msvc.log
