# SuperDex: build its Python wheels with Anubis and use them.
#
# The Anubis port of SuperDex lives on branch `anubis-build` of
# github.com/forrestthewoods/superdex (a SuperDex workspace with its own
# ANUBIS files, mode/ and toolchains/, never part of this repo). Each host
# (Linux, Windows) checks it out next to this repo, builds this Anubis, and
# builds the wheels for both targets (Linux wheels use linux_release_static,
# Windows wheels win_release). Then each OS installs every host's wheels into
# a stock CPython 3.12 and runs two examples.
#
# Manual only (Actions tab, "SuperDex", Run workflow). `wheels: core` builds
# superdex-physics and superdex-robotics; `all` adds the fp64 twins, the
# debugger, studio and mesh-cli (OpenCASCADE: much longer).
name: SuperDex

on:
  # TEMP: remove before merge
  push:
    branches: [claude/project-thread-8dumkj]
  workflow_dispatch:
    inputs:
      superdex_ref:
        description: 'forrestthewoods/superdex commit or branch (the Anubis port)'
        default: eff065c3a49a72b0dfa36d74d62f4b372106cf5e
      wheels:
        description: 'Which wheels'
        type: choice
        default: core
        options: [core, all]

concurrency:
  group: superdex-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SUPERDEX_REF: ${{ inputs.superdex_ref || 'eff065c3a49a72b0dfa36d74d62f4b372106cf5e' }}
  WHEELS: ${{ inputs.wheels || 'core' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            runner: ubuntu-latest
          - host: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      MSYS_NO_PATHCONV: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: anubis
      - uses: actions/checkout@v4
        with:
          repository: forrestthewoods/superdex
          ref: ${{ env.SUPERDEX_REF }}
          path: superdex
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: anubis
      - name: Build anubis
        working-directory: anubis
        run: cargo build --release
      - name: Install SuperDex's toolchains
        working-directory: superdex
        run: ../anubis/target/release/anubis install-toolchains --no-tui
      - name: Build the wheels for Linux and Windows
        working-directory: superdex
        run: |
          T="//:physics_wheel //:robotics_wheel"
          if [ "$WHEELS" = all ]; then
            T="$T //:physics_fp64_wheel //:robotics_fp64_wheel //:physics_debugger_wheel //:studio_wheel //:mesh_cli_wheel"
          fi
          start=$(date +%s)
          ../anubis/target/release/anubis build --no-tui --stats \
            -m //mode:linux_release_static //mode:win_release -t $T
          echo "wheel build: $(( $(date +%s) - start ))s"
      - name: Collect
        working-directory: superdex
        run: |
          mkdir -p ../dist/linux ../dist/win
          find .anubis-out -path '*/py_wheel/*' -name '*manylinux*.whl' -exec cp {} ../dist/linux/ \;
          find .anubis-out -path '*/py_wheel/*' -name '*win_amd64.whl' -exec cp {} ../dist/win/ \;
          ls -l ../dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: superdex-wheels-from-${{ matrix.host }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  run:
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: win
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # Only for the examples and their assets; the code comes from the wheels.
      - uses: actions/checkout@v4
        with:
          repository: forrestthewoods/superdex
          ref: ${{ env.SUPERDEX_REF }}
          path: superdex
      - uses: actions/download-artifact@v4
        with:
          pattern: superdex-wheels-from-*
          path: wheels
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install each host's wheels and run the examples
        timeout-minutes: 30
        run: |
          set -u
          failed=0; summary=()
          for d in wheels/superdex-wheels-from-*; do
            host=${d##*-from-}
            echo "=== ${{ matrix.os }} wheels from $host"
            ls "$d/${{ matrix.os }}"
            venv=$RUNNER_TEMP/venv-$host
            python -m venv "$venv"
            py=$venv/bin/python; [ -x "$py" ] || py=$venv/Scripts/python.exe
            ok=1
            "$py" -m pip install --quiet "$d/${{ matrix.os }}"/*.whl || ok=0
            for ex in superdex/superdex_physics/examples/example_rigid_bodies.py \
                      superdex/superdex_robotics/examples/basic/example_bot_loading.py; do
              [ $ok = 1 ] || break
              echo "--- $ex"
              # Run from outside the checkout so only the installed packages import.
              (cd "$RUNNER_TEMP" && timeout 600 "$py" "$GITHUB_WORKSPACE/$ex") || ok=0
            done
            if [ $ok = 1 ]; then summary+=("PASS  ${{ matrix.os }} wheels from $host")
            else summary+=("FAIL  ${{ matrix.os }} wheels from $host"); failed=1; fi
          done
          echo; echo "=== Results"; printf '%s\n' "${summary[@]}"
          exit $failed
