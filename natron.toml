# Toolchains for this repo, installed by `anubis install-toolchains`
# (or the standalone `natron install`). Everything lands in toolchains/,
# with the same layout on every host, so toolchains/ANUBIS can use one
# path per tool. Entries with `hosts` are only installed on those hosts.
# `url` and `github` entries must pin their archive with `sha256`, so this
# file is also the toolchain lock. Zig is verified against ziglang.org's
# index.json; MSVC and the SDK are pinned by exact build version.
#
# The download cache is shared across projects (default ~/.natron/);
# toolchains/<dir> are symlinks into it.

[settings]
deploy_dir = "toolchains"

# === LLVM / Clang =========================================================
[[toolchain]]
name       = "llvm_windows"
deploy_dir = "llvm"
provider   = "github"
hosts      = ["windows-x64"]
[toolchain.options]
repo         = "llvm/llvm-project"
tag          = "llvmorg-21.1.6"
version      = "21.1.6"
asset        = "clang+llvm-21.1.6-x86_64-pc-windows-msvc.tar.xz"
strip_prefix = "clang+llvm-21.1.6-x86_64-pc-windows-msvc"
sha256       = "6fd57e4461f4f30913c6a345dd093d71df963aaf94f1ec80bb5cfb24ebb047a1"

[[toolchain]]
name       = "llvm_linux"
deploy_dir = "llvm"
provider   = "github"
hosts      = ["linux-x64"]
[toolchain.options]
repo         = "llvm/llvm-project"
tag          = "llvmorg-21.1.6"
version      = "21.1.6"
asset        = "LLVM-21.1.6-Linux-X64.tar.xz"
strip_prefix = "LLVM-21.1.6-Linux-X64"
sha256       = "8ac1aadfa96b87b8747f7383d06ed9579f9d5c32a1af7af947b0cfe29d88ac87"

# === Zig (bundled glibc + libc++ for Linux targets) =======================
[[toolchain]]
name       = "zig_windows"
deploy_dir = "zig"
provider   = "zig"
hosts      = ["windows-x64"]
[toolchain.options]
version  = "0.15.2"
platform = "x86_64-windows"

[[toolchain]]
name       = "zig_linux"
deploy_dir = "zig"
provider   = "zig"
hosts      = ["linux-x64"]
[toolchain.options]
version  = "0.15.2"
platform = "x86_64-linux"

# === NASM ================================================================
# nasm.us ships no Linux binaries, so Linux takes Debian's build of the same
# version (needs glibc 2.38+). The main pool is fast but drops old versions;
# snapshot.debian.org keeps them forever but is slow and sometimes times out.
[[toolchain]]
name       = "nasm_linux"
deploy_dir = "nasm"
provider   = "deb"
hosts      = ["linux-x64"]
[toolchain.options]
mirror       = ["https://deb.debian.org/debian", "https://snapshot.debian.org/archive/debian/20251101T000000Z"]
strip_prefix = "usr/bin"
packages = [
  { path = "pool/main/n/nasm/nasm_3.01-1_amd64.deb", sha256 = "d1108e7cb160ed9dbaf11642aee6eda9e9a589bbad1cabbf33e4d72d1f7173ae" },
]

[[toolchain]]
name       = "nasm_windows"
deploy_dir = "nasm"
provider   = "url"
hosts      = ["windows-x64"]
[toolchain.options]
url          = "https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip"
strip_prefix = "nasm-3.01"
sha256       = "e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4"

# RadLinker (raddebugger's linker), Windows hosts only.
[[toolchain]]
name       = "radlink_windows"
deploy_dir = "radlink"
provider   = "github"
hosts      = ["windows-x64"]
[toolchain.options]
repo    = "EpicGamesExt/raddebugger"
tag     = "v0.9.29-alpha"
asset   = "radlink.exe"
archive = "file"
sha256  = "ce5b5106392a49548f727ac37f86d38c4f5a15ae40e1f49a5a3cfd6ea632401a"

# === MSVC CRT + Windows SDK (Windows targets, from any host) =============
[[toolchain]]
name       = "msvc"
deploy_dir = "msvc"
provider   = "msvc"
[toolchain.options]
build_version = "18.6.11819.183"   # VS 2026 18.6.1; `natron msvc versions` lists others

[[toolchain]]
name       = "windows_sdk"
deploy_dir = "windows_kits"
provider   = "windows_sdk"
[toolchain.options]
sdk_version = "26100"

# === Python (python-build-standalone) + uv ================================
# One interpreter per target platform, installed on every host: the host's
# own copy runs Python, the other supplies headers and import libs when
# cross-compiling extensions (like the MSVC CRT for Windows targets).
[[toolchain]]
name       = "python_linux"
deploy_dir = "python/linux_x64"
provider   = "github"
[toolchain.options]
repo         = "astral-sh/python-build-standalone"
tag          = "20260718"
version      = "3.12.13"
asset        = "cpython-3.12.13+20260718-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
strip_prefix = "python"
sha256       = "5854aa6ec71cad00334d5065633c210b2e7feb40956767a59a91791cadcf0b79"

[[toolchain]]
name       = "python_windows"
deploy_dir = "python/windows_x64"
provider   = "github"
[toolchain.options]
repo         = "astral-sh/python-build-standalone"
tag          = "20260718"
version      = "3.12.13"
asset        = "cpython-3.12.13+20260718-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
strip_prefix = "python"
sha256       = "0d422a1439ec308e03f47df551bc30f5994727c456e414b026d202bcda9b7c1c"

[[toolchain]]
name       = "uv_linux"
deploy_dir = "uv"
provider   = "github"
hosts      = ["linux-x64"]
[toolchain.options]
repo         = "astral-sh/uv"
tag          = "0.11.32"
version      = "0.11.32"
asset        = "uv-x86_64-unknown-linux-gnu.tar.gz"
strip_prefix = "uv-x86_64-unknown-linux-gnu"
sha256       = "aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967"

[[toolchain]]
name       = "uv_windows"
deploy_dir = "uv"
provider   = "github"
hosts      = ["windows-x64"]
[toolchain.options]
repo    = "astral-sh/uv"
tag     = "0.11.32"
version = "0.11.32"
asset   = "uv-x86_64-pc-windows-msvc.zip"
sha256  = "acfde570451cfdb8689fa159a138ee805ba4e241c466432750302c86254b0984"
