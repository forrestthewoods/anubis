# Toolchains for this repo, installed by `anubis install-toolchains`
# (or the standalone `natron install`). Everything lands in toolchains/,
# with the same layout on every host, so toolchains/ANUBIS can use one
# path per tool. Entries with `hosts` are only installed on those hosts.
# `url` and `github` entries must pin their archive with `sha256`, so this
# file is also the toolchain lock. Zig is verified against ziglang.org's
# index.json; MSVC and the SDK are pinned by exact build version.
#
# The download cache is shared across projects (default ~/.natron/);
# toolchains/<dir> are symlinks into it.

[settings]
deploy_dir = "toolchains"

# === LLVM / Clang =========================================================
[[toolchain]]
name       = "llvm_windows"
deploy_dir = "llvm"
provider   = "github"
hosts      = ["windows-x64"]
[toolchain.options]
repo         = "llvm/llvm-project"
tag          = "llvmorg-21.1.6"
version      = "21.1.6"
asset        = "clang+llvm-21.1.6-x86_64-pc-windows-msvc.tar.xz"
strip_prefix = "clang+llvm-21.1.6-x86_64-pc-windows-msvc"
sha256       = "6fd57e4461f4f30913c6a345dd093d71df963aaf94f1ec80bb5cfb24ebb047a1"

[[toolchain]]
name       = "llvm_linux"
deploy_dir = "llvm"
provider   = "github"
hosts      = ["linux-x64"]
[toolchain.options]
repo         = "llvm/llvm-project"
tag          = "llvmorg-21.1.6"
version      = "21.1.6"
asset        = "LLVM-21.1.6-Linux-X64.tar.xz"
strip_prefix = "LLVM-21.1.6-Linux-X64"
sha256       = "8ac1aadfa96b87b8747f7383d06ed9579f9d5c32a1af7af947b0cfe29d88ac87"

# === Zig (bundled glibc + libc++ for Linux targets) =======================
[[toolchain]]
name       = "zig_windows"
deploy_dir = "zig"
provider   = "zig"
hosts      = ["windows-x64"]
[toolchain.options]
version  = "0.15.2"
platform = "x86_64-windows"

[[toolchain]]
name       = "zig_linux"
deploy_dir = "zig"
provider   = "zig"
hosts      = ["linux-x64"]
[toolchain.options]
version  = "0.15.2"
platform = "x86_64-linux"

# === NASM ================================================================
# nasm.us ships no Linux binaries, so Linux takes Debian's build of the same
# version (needs glibc 2.38+). The main pool is fast but drops old versions;
# snapshot.debian.org keeps them forever but is slow and sometimes times out.
[[toolchain]]
name       = "nasm_linux"
deploy_dir = "nasm"
provider   = "deb"
hosts      = ["linux-x64"]
[toolchain.options]
mirror       = ["https://deb.debian.org/debian", "https://snapshot.debian.org/archive/debian/20251101T000000Z"]
strip_prefix = "usr/bin"
packages = [
  { path = "pool/main/n/nasm/nasm_3.01-1_amd64.deb", sha256 = "d1108e7cb160ed9dbaf11642aee6eda9e9a589bbad1cabbf33e4d72d1f7173ae" },
]

[[toolchain]]
name       = "nasm_windows"
deploy_dir = "nasm"
provider   = "url"
hosts      = ["windows-x64"]
[toolchain.options]
url          = "https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip"
strip_prefix = "nasm-3.01"
sha256       = "e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4"

# RadLinker (raddebugger's linker), Windows hosts only.
[[toolchain]]
name       = "radlink_windows"
deploy_dir = "radlink"
provider   = "github"
hosts      = ["windows-x64"]
[toolchain.options]
repo    = "EpicGamesExt/raddebugger"
tag     = "v0.9.29-alpha"
asset   = "radlink.exe"
archive = "file"
sha256  = "ce5b5106392a49548f727ac37f86d38c4f5a15ae40e1f49a5a3cfd6ea632401a"

# === macOS SDK + compiler-rt source (macOS targets, from any host) =======
# The SDK comes from Apple's Command Line Tools package on Apple's update CDN
# (no Mac, Xcode or Apple ID). It is pinned by the hash of the package's
# payload, not the package: Apple re-publishes the same SDK under new URLs and
# withdraws old ones, so Natron also searches Apple's current catalog for a
# package with this payload. `natron apple-sdk list` / `pin <url>` print the
# values for a bump. Use of the SDK is governed by Apple's Xcode and Apple
# SDKs Agreement; complying with it is up to you.
[[toolchain]]
name       = "macos_sdk"
deploy_dir = "macos_sdk"
provider   = "apple_sdk"
[toolchain.options]
sdk            = "MacOSX26.5.sdk"
package        = "CLTools_macOSNMOS_SDK.pkg"
payload_sha256 = "636067ec79b17c417cf07a22caf9b0e147766dc52e4ce3658365c52835a4778e"
urls           = [
  "https://swcdn.apple.com/content/downloads/33/19/140-17812-A_21ZLMMLY4E/zu3xwktttpoe71qiawhzgzvqss6rovawsa/CLTools_macOSNMOS_SDK.pkg",
  "https://swcdn.apple.com/content/downloads/09/08/047-91568-A_Y1CFZWQCD4/4xekpyz43i26dbp4enxfro8eb1q7wiujh5/CLTools_macOSNMOS_SDK.pkg",
]

# compiler-rt sources, for the few darwin builtins Apple's linker would pull
# from libclang_rt.osx.a (e.g. `__isPlatformVersionAtLeast` behind
# `@available`). toolchains/ANUBIS builds them as a small static library for
# each macOS target, so no host needs a macOS LLVM build.
[[toolchain]]
name       = "compiler_rt_src"
deploy_dir = "compiler_rt"
provider   = "github"
[toolchain.options]
repo         = "llvm/llvm-project"
tag          = "llvmorg-21.1.6"
version      = "21.1.6"
asset        = "compiler-rt-21.1.6.src.tar.xz"
strip_prefix = "compiler-rt-21.1.6.src"
sha256       = "bdd904f3aac9f4c4424f3440aff498cc04d66f243e37156b6d167ffb7b599f89"

# === MSVC CRT + Windows SDK (Windows targets, from any host) =============
[[toolchain]]
name       = "msvc"
deploy_dir = "msvc"
provider   = "msvc"
[toolchain.options]
build_version = "18.6.11819.183"   # VS 2026 18.6.1; `natron msvc versions` lists others

[[toolchain]]
name       = "windows_sdk"
deploy_dir = "windows_kits"
provider   = "windows_sdk"
[toolchain.options]
sdk_version = "26100"
