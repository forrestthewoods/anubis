# Toolchains for this repo, installed by `anubis install-toolchains`
# (or the standalone `natron install`). Everything lands in toolchains/,
# with the same layout on every host, so toolchains/ANUBIS can use one
# path per tool. Entries with `hosts` are only installed on those hosts.
# `url` and `github` entries must pin their archive with `sha256`, so this
# file is also the toolchain lock. Zig is verified against ziglang.org's
# index.json; MSVC and the SDK are pinned by exact build version.
#
# The download cache is shared across projects (default ~/.natron/);
# toolchains/<dir> are symlinks into it.

[settings]
deploy_dir = "toolchains"

# === LLVM / Clang =========================================================
[[toolchain]]
name       = "llvm_windows"
deploy_dir = "llvm"
provider   = "github"
hosts      = ["windows-x64"]
[toolchain.options]
repo         = "llvm/llvm-project"
tag          = "llvmorg-23.1.5"
version      = "23.1.5"
asset        = "clang+llvm-23.1.5-x86_64-pc-windows-msvc.tar.xz"
strip_prefix = "clang+llvm-23.1.5-x86_64-pc-windows-msvc"
sha256       = "62fdada7f6fa2b73856486dfbbdba3d2c1882991621615bcb55c60207611c6d4"

[[toolchain]]
name       = "llvm_linux"
deploy_dir = "llvm"
provider   = "github"
hosts      = ["linux-x64"]
[toolchain.options]
repo         = "llvm/llvm-project"
tag          = "llvmorg-23.1.5"
version      = "23.1.5"
asset        = "LLVM-23.1.5-Linux-X64.tar.xz"
strip_prefix = "LLVM-23.1.5-Linux-X64"
sha256       = "f72edb0b36580ece7f52e23858f00c18fad4e87395ea7ad05d7e55c39f8fc78a"

[[toolchain]]
name       = "llvm_macos"
deploy_dir = "llvm"
provider   = "github"
hosts      = ["macos-arm64"]
[toolchain.options]
repo         = "llvm/llvm-project"
tag          = "llvmorg-23.1.5"
version      = "23.1.5"
asset        = "LLVM-23.1.5-macOS-ARM64.tar.xz"
strip_prefix = "LLVM-23.1.5-macOS-ARM64"
sha256       = "aba592b4a15e8f90c634c5367b51ec8418b8bcd2829865db331a17dc9418dcff"

# === Zig (bundled glibc + libc++ for Linux targets) =======================
[[toolchain]]
name       = "zig_windows"
deploy_dir = "zig"
provider   = "zig"
hosts      = ["windows-x64"]
[toolchain.options]
version  = "0.15.2"
platform = "x86_64-windows"

[[toolchain]]
name       = "zig_linux"
deploy_dir = "zig"
provider   = "zig"
hosts      = ["linux-x64"]
[toolchain.options]
version  = "0.15.2"
platform = "x86_64-linux"

[[toolchain]]
name       = "zig_macos"
deploy_dir = "zig"
provider   = "zig"
hosts      = ["macos-arm64"]
[toolchain.options]
version  = "0.15.2"
platform = "aarch64-macos"

# === NASM ================================================================
# nasm.us ships no Linux binaries, so Linux takes Debian's build of the same
# version (needs glibc 2.38+). The main pool is fast but drops old versions;
# snapshot.debian.org keeps them forever but is slow and sometimes times out.
[[toolchain]]
name       = "nasm_linux"
deploy_dir = "nasm"
provider   = "deb"
hosts      = ["linux-x64"]
[toolchain.options]
mirror       = ["https://deb.debian.org/debian", "https://snapshot.debian.org/archive/debian/20251101T000000Z"]
strip_prefix = "usr/bin"
packages = [
  { path = "pool/main/n/nasm/nasm_3.01-1_amd64.deb", sha256 = "d1108e7cb160ed9dbaf11642aee6eda9e9a589bbad1cabbf33e4d72d1f7173ae" },
]

[[toolchain]]
name       = "nasm_windows"
deploy_dir = "nasm"
provider   = "url"
hosts      = ["windows-x64"]
[toolchain.options]
url          = "https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip"
strip_prefix = "nasm-3.01"
sha256       = "e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4"

# nasm.us's macOS build is Intel-only, so Apple silicon hosts take Homebrew's
# arm64 bottle of the same version (built for macOS 14, links only libSystem
# and libz). A bottle is a tar.gz stored as a blob in GitHub's registry.
[[toolchain]]
name       = "nasm_macos"
deploy_dir = "nasm"
provider   = "url"
hosts      = ["macos-arm64"]
[toolchain.options]
url          = "https://ghcr.io/v2/homebrew/core/nasm/blobs/sha256:eca617b897d2e594511ca59690799341e9600e2e511ee95e057a36b28dde0edd"
archive      = "tar.gz"
strip_prefix = "nasm/3.01/bin"
sha256       = "eca617b897d2e594511ca59690799341e9600e2e511ee95e057a36b28dde0edd"

# RadLinker (raddebugger's linker), Windows hosts only.
[[toolchain]]
name       = "radlink_windows"
deploy_dir = "radlink"
provider   = "github"
hosts      = ["windows-x64"]
[toolchain.options]
repo    = "EpicGamesExt/raddebugger"
tag     = "v0.9.29-alpha"
asset   = "radlink.exe"
archive = "file"
sha256  = "ce5b5106392a49548f727ac37f86d38c4f5a15ae40e1f49a5a3cfd6ea632401a"

# === macOS SDK + compiler-rt source (macOS targets, from any host) =======
# The SDK comes from Apple's Command Line Tools package on Apple's update CDN
# (no Mac, Xcode or Apple ID). It is pinned by the hash of the package's
# payload, not the package: Apple re-publishes the same SDK under new URLs and
# withdraws old ones, so Natron also searches Apple's current catalog for a
# package with this payload. `natron apple-sdk list` / `pin <url>` print the
# values for a bump. Use of the SDK is governed by Apple's Xcode and Apple
# SDKs Agreement; complying with it is up to you.
[[toolchain]]
name       = "macos_sdk"
deploy_dir = "macos_sdk"
provider   = "apple_sdk"
[toolchain.options]
sdk            = "MacOSX26.5.sdk"
package        = "CLTools_macOSNMOS_SDK.pkg"
payload_sha256 = "636067ec79b17c417cf07a22caf9b0e147766dc52e4ce3658365c52835a4778e"
urls           = [
  "https://swcdn.apple.com/content/downloads/33/19/140-17812-A_21ZLMMLY4E/zu3xwktttpoe71qiawhzgzvqss6rovawsa/CLTools_macOSNMOS_SDK.pkg",
  "https://swcdn.apple.com/content/downloads/09/08/047-91568-A_Y1CFZWQCD4/4xekpyz43i26dbp4enxfro8eb1q7wiujh5/CLTools_macOSNMOS_SDK.pkg",
]

# compiler-rt sources, for the few darwin builtins Apple's linker would pull
# from libclang_rt.osx.a (e.g. `__isPlatformVersionAtLeast` behind
# `@available`). toolchains/ANUBIS builds them as a small static library for
# each macOS target, so no host needs a macOS LLVM build.
[[toolchain]]
name       = "compiler_rt_src"
deploy_dir = "compiler_rt"
provider   = "github"
[toolchain.options]
repo         = "llvm/llvm-project"
# Stays on 21.1.6: LLVM stopped publishing per-project source tarballs
# (23.x has only the 179 MB llvm-project one), and os_version_check.c is
# plain C that doesn't need to match the compiler's version.
tag          = "llvmorg-21.1.6"
version      = "21.1.6"
asset        = "compiler-rt-21.1.6.src.tar.xz"
strip_prefix = "compiler-rt-21.1.6.src"
sha256       = "bdd904f3aac9f4c4424f3440aff498cc04d66f243e37156b6d167ffb7b599f89"

# === MSVC CRT + Windows SDK (Windows targets, from any host) =============
[[toolchain]]
name       = "msvc"
deploy_dir = "msvc"
provider   = "msvc"
[toolchain.options]
build_version   = "18.6.11819.183"   # VS 2026 18.6.1; `natron msvc versions` lists others
manifest_commit = "329b52d92875be0aaf5f2258a18f7df5edf95abd"   # roblabla/msvc-manifest-history snapshot of that build

[[toolchain]]
name       = "windows_sdk"
deploy_dir = "windows_kits"
provider   = "windows_sdk"
[toolchain.options]
sdk_version     = "26100"            # 10.0.26100.16 in this snapshot
manifest_commit = "329b52d92875be0aaf5f2258a18f7df5edf95abd"   # same snapshot as msvc

# === Python (python-build-standalone) + uv ================================
# One interpreter per target platform, installed on every host: the host's
# own copy runs Python, the other supplies headers and import libs when
# cross-compiling extensions (like the MSVC CRT for Windows targets).
[[toolchain]]
name       = "python_linux"
deploy_dir = "python/linux_x64"
provider   = "github"
[toolchain.options]
repo         = "astral-sh/python-build-standalone"
tag          = "20260718"
version      = "3.12.13"
asset        = "cpython-3.12.13+20260718-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
strip_prefix = "python"
sha256       = "5854aa6ec71cad00334d5065633c210b2e7feb40956767a59a91791cadcf0b79"

[[toolchain]]
name       = "python_windows"
deploy_dir = "python/windows_x64"
provider   = "github"
[toolchain.options]
repo         = "astral-sh/python-build-standalone"
tag          = "20260718"
version      = "3.12.13"
asset        = "cpython-3.12.13+20260718-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
strip_prefix = "python"
sha256       = "0d422a1439ec308e03f47df551bc30f5994727c456e414b026d202bcda9b7c1c"

[[toolchain]]
name       = "uv_linux"
deploy_dir = "uv"
provider   = "github"
hosts      = ["linux-x64"]
[toolchain.options]
repo         = "astral-sh/uv"
tag          = "0.11.32"
version      = "0.11.32"
asset        = "uv-x86_64-unknown-linux-gnu.tar.gz"
strip_prefix = "uv-x86_64-unknown-linux-gnu"
sha256       = "aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967"

[[toolchain]]
name       = "uv_windows"
deploy_dir = "uv"
provider   = "github"
hosts      = ["windows-x64"]
[toolchain.options]
repo    = "astral-sh/uv"
tag     = "0.11.32"
version = "0.11.32"
asset   = "uv-x86_64-pc-windows-msvc.zip"
sha256  = "acfde570451cfdb8689fa159a138ee805ba4e241c466432750302c86254b0984"

# === hatchling (py_wheel) ==================================================
# The Python build backend `py_wheel` runs to make a package's Python part,
# and what it imports. Each is a pure-Python wheel from PyPI (a zip); the
# rule puts these directories on sys.path. No pip, no network in the build.
[[toolchain]]
name       = "hatchling"
deploy_dir = "hatchling/hatchling"
provider   = "url"
[toolchain.options]
url     = "https://files.pythonhosted.org/packages/32/64/4afe5dd77b2939a93e8c9513f8082dbd049ecba9c1484a379a0f6ae29d6b/hatchling-1.33.0-py3-none-any.whl"
archive = "zip"
sha256  = "415290b84f464d2884303fca8974d38e7b85579069fab02a15db0828fbb1446d"

[[toolchain]]
name       = "hatchling_packaging"
