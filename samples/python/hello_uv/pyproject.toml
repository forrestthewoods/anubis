# A Python package whose native extension is built by Anubis.
#   uv run --no-sync python -c "import hello_pkg; print(hello_pkg.add(2, 3))"
# This file is plain Python packaging: hatchling knows nothing about the C
# code. `anubis run` copies the extension into .venv, and `anubis wheel`
# adds it to the wheel hatchling makes (hello_pkg/_native/).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hello-pkg"
version = "0.1.0"
requires-python = "==3.12.*"

[project.scripts]
hello-greet = "hello_pkg:main"

[tool.hatch.build.targets.wheel]
packages = ["hello_pkg"]
